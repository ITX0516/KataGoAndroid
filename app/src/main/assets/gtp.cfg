# KataGo GTP 配置（Android EIGEN 模式）
# 最小可用版本，配合 KataGoAndroid/app/src/main/cpp/katago_engine.cpp 使用
# 代码会强制覆盖：maxVisits=10, numSearchThreads=1（CPU 友好）

# ─── 日志 ────────────────────────────────────────────────────────
# logDir 留空使用 App 沙盒 filesDir，App 启动时 cwd 已是 filesDir
logDir = .
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
logToStderr = false
startupPrintMessageToStderr = false

# ─── 模型 ────────────────────────────────────────────────────────
# 模型文件名（运行时由 Kotlin 层从 assets 复制到 filesDir 后用绝对路径覆盖）
# 留空让 KataGoEngine 通过 ConfigParser 注入真实路径
# nnModelFile = b10c384.bin

# ─── 搜索参数 ────────────────────────────────────────────────────
# 代码里已硬编码 maxVisits=10 / numSearchThreads=1
# 这里写一遍只是兜底
maxVisits = 10
numSearchThreads = 1
maxPlayouts = 10
maxTime = 10.0

# 启用 MCTS 树重用（连续 genmove 时复用搜索树，加速思考）
# 但 Android 上每次 genmove 我们都重建 bot，所以效果有限
lagRange = 5
ponderingEnabled = false
avoidRepeatedPatternUtility = 0.5

# ─── 规则 ────────────────────────────────────────────────────────
# 代码里设了 Rules::parseRules("chinese")，这里只是兜底
rules = chinese
# 让 komi 跟随 boardsize（9 路 7.5, 13 路 7.5, 19 路 7.5）
# 也可固定：komi = 6.5
# allowOGSPass = true

# ─── 后端 ────────────────────────────────────────────────────────
# EIGEN 后端，不需要 OpenCL/CUDA 相关参数
# 这些参数对 EIGEN 后端无效，但保留以防 KataGo 内部引用
# openclGpuToUse =
# openclReTunePerBoardSize = false
# openclAutoMemory = true

# ─── 杂项 ────────────────────────────────────────────────────────
# 关闭 libzip 相关（selfplay 才需要，APK 不需要）
# 代码已加 NO_LIBZIP 宏
reportAnalysisWinratesAs = BLACK
